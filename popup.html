<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        padding: 16px;
        margin: 0;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 14px;
        color: #111;
      }
      #status {
        font-size: 13px;
        color: #666;
        margin-bottom: 12px;
        min-height: 20px;
      }
      #status.error {
        color: #dc2626;
      }
      #status.success {
        color: #059669;
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #capture {
        background: #4f46e5;
        color: white;
      }
      #capture:hover:not(:disabled) {
        background: #4338ca;
      }
      #signin {
        background: #4f46e5;
        color: white;
      }
      #signin:hover {
        background: #4338ca;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h3>Traction Beast</h3>
    <div id="status">Checking page...</div>
    <button id="capture" disabled>Capture SERP</button>
    <button id="signin" class="hidden">Sign in to Traction Beast</button>
    <script src="popup.js"></script>
  </body>
</html>
